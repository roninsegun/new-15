<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сэндвич — тест</title>
  <link rel="preload" href="../fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/inter-tight-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../fonts/inter-tight.css">
  <link rel="stylesheet" href="../fonts/newsreader.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <!-- fixed layer with the coin: z-index 5, between the text lines (4 / 6) -->
  <div class="stage" aria-hidden="true">
    <canvas id="coin"></canvas>
    <div class="progress t-meta" id="progress">0 / 120</div>
  </div>

  <section class="screen">
    <h1 class="title t-display-serif">
      <span class="line front">Struck by hand</span>
      <span class="line back">in worn copper</span>
    </h1>
  </section>

  <section class="screen">
    <h2 class="title t-display-serif">
      <span class="line back">Turned by time</span>
      <span class="line front">still turning</span>
    </h2>
  </section>

  <section class="screen">
    <p class="note t-meta">конец теста · скролл вверх</p>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
